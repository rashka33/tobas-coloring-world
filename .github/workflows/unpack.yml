name: unpack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site package
        run: |
          unzip -o github-coloring-world.zip -d .
          rm -f github-coloring-world.zip
          rm -rf .github/workflows/unpack.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Full site package: index + assets" || echo "nothing to commit"
          git push
