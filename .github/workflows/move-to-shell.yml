name: Move tmp to index-shell
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-to-shell.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move tmp/index.html to index-shell.html
        run: |
          if [ -f tmp/index.html ]; then
            git config user.name "rashka33"
            git config user.email "rashka33@users.noreply.github.com"
            git mv tmp/index.html index-shell.html
            git commit -m "Move tmp/index.html to index-shell.html"
            git push
          else
            echo "tmp/index.html not present, nothing to do"
          fi
