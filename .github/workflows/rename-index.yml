name: Rename temp file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "rashka33"
          git config user.email "rashka33@users.noreply.github.com"
          git mv toba-s-coloring-world-link-version.html index.html
          git commit -m "Rename toba-s-coloring-world-link-version.html to index.html"
          git push
